name: CI

on:
  pull_request:
    branches: [main]
  # main was never checked: CI only ran on the way in, so anything that reached
  # main outside a PR went unlinted and the next PR to open inherited the red.
  # That is how the prefer-const error in previewAuthStorage landed on #118,
  # a config-only PR touching nothing in src/.
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm test
      - run: npm run build
